# BlueDrive - production stack. Usage (from deploy/):  docker compose up -d
# Sized for 1 server: 8 cores / 16 GB RAM / 520 GB SSD.
name: bluedrive

x-dotnet-env: &dotnet-env
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-bluedrive};Username=${POSTGRES_USER:-bluedrive};Password=${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  Logging__Directory: /app/logs
  App__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost}
  App__OrganizationName: ${ORGANIZATION_NAME:-Trung tâm Thông tin, Chuyển đổi số và Dịch vụ dân số}
  Jwt__Secret: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
  Seed__AdminPassword: ${ADMIN_PASSWORD:?Thiếu ADMIN_PASSWORD trong .env}
  Seed__AdminEmail: ${ADMIN_EMAIL:-}
  Seed__Demo: ${SEED_DEMO:-false}
  Seed__DemoPassword: ${DEMO_PASSWORD:-}
  Storage__Provider: ${STORAGE_PROVIDER:-local}
  Storage__LocalRoot: /data/storage
  Storage__EncryptAtRest: ${STORAGE_ENCRYPT_AT_REST:-true}
  Storage__MasterKey: ${STORAGE_MASTER_KEY:?Thiếu STORAGE_MASTER_KEY trong .env}
  Storage__S3__ServiceUrl: ${S3_SERVICE_URL:-}
  Storage__S3__Bucket: ${S3_BUCKET:-}
  Storage__S3__AccessKey: ${S3_ACCESS_KEY:-}
  Storage__S3__SecretKey: ${S3_SECRET_KEY:-}
  Storage__S3__Region: ${S3_REGION:-us-east-1}
  Backup__Root: /data/backups
  Backup__S3Enabled: ${BACKUP_S3_ENABLED:-false}
  OnlyOffice__PublicUrl: ${PUBLIC_BASE_URL:-http://localhost}/office
  OnlyOffice__InternalUrl: http://onlyoffice
  OnlyOffice__CallbackBaseUrl: http://api:8080
  OnlyOffice__JwtSecret: ${ONLYOFFICE_JWT_SECRET:?Thiếu ONLYOFFICE_JWT_SECRET trong .env}
  ClamAv__Enabled: ${CLAMAV_ENABLED:-false}
  ClamAv__Host: clamav
  ClamAv__Port: 3310
  Smtp__Host: ${SMTP_HOST:-}
  Smtp__Port: ${SMTP_PORT:-587}
  Smtp__User: ${SMTP_USER:-}
  Smtp__Password: ${SMTP_PASSWORD:-}
  Smtp__From: ${SMTP_FROM:-}
  Smtp__UseSsl: ${SMTP_USE_SSL:-true}
  Cors__Origins__0: ${PUBLIC_BASE_URL:-http://localhost}
  TZ: Asia/Ho_Chi_Minh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bluedrive}
      POSTGRES_USER: ${POSTGRES_USER:-bluedrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    command: >
      postgres -c shared_buffers=768MB -c effective_cache_size=2GB -c work_mem=16MB
      -c maintenance_work_mem=256MB -c max_connections=200
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g }

  api:
    image: bluedrive/api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: src/BlueDrive.Api/Dockerfile
      args: { GIT_SHA: "${GIT_SHA:-dev}" }
    restart: unless-stopped
    environment:
      <<: *dotnet-env
    volumes:
      - file_storage:/data/storage
      - backups:/data/backups
      - logs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  worker:
    image: bluedrive/worker:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: src/BlueDrive.Worker/Dockerfile
      args: { GIT_SHA: "${GIT_SHA:-dev}" }
    restart: unless-stopped
    environment:
      <<: *dotnet-env
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-bluedrive}
      PGUSER: ${POSTGRES_USER:-bluedrive}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - file_storage:/data/storage
      - backups:/data/backups
      - logs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  web:
    image: bluedrive/web:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  onlyoffice:
    image: onlyoffice/documentserver:9.2
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Thiếu ONLYOFFICE_JWT_SECRET trong .env}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
      WOPI_ENABLED: "false"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4g }

  clamav:
    image: clamav/clamav:1.5-debian
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 3g }

  reverse-proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, onlyoffice]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

volumes:
  pg_data:
  file_storage:
  backups:
  onlyoffice_data:
  onlyoffice_logs:
  logs:
  clamav_db:
  caddy_data:
  caddy_config:
