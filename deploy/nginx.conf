# BlueDrive web: serves the React SPA and reverse-proxies the API.
# Installed as /etc/nginx/conf.d/default.conf (included in the http {} context).

# WebSocket upgrade support (SignalR /hubs/).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the original scheme when running behind the Caddy reverse proxy (TLS terminated there).
map $http_x_forwarded_proto $bd_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream bluedrive_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml font/ttf font/otf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://bluedrive_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bd_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- tus resumable uploads ----------
    # Prefix '/tus' (no slash): upload creation is POST /tus, chunks are PATCH /tus/{id}.
    location /tus {
        proxy_pass http://bluedrive_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bd_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- SignalR hubs (WebSocket) ----------
    location /hubs/ {
        proxy_pass http://bluedrive_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bd_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Downloads / streaming go through /api/v1/content/{token} (block above); /files/* are SPA routes.

    # ---------- Health ----------
    location = /health {
        proxy_pass http://bluedrive_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bd_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    # ---------- BlueDrive Desktop releases (installer, Velopack update feed, releases.json) ----------
    # Filled from the GitHub release by scripts/sync-desktop-downloads.sh (deploy) into DESKTOP_DOWNLOADS_DIR.
    location /downloads/desktop/ {
        alias /usr/share/nginx/downloads/desktop/;
        autoindex off;
        default_type application/octet-stream;
        types { application/json json; application/msix msix; application/appinstaller appinstaller; }
        add_header X-Content-Type-Options nosniff always;
        location ~ \.(json|appinstaller)$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    # ---------- Static assets (hashed filenames) ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- SPA fallback ----------
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
