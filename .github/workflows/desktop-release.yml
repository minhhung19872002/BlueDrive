# BlueDrive Desktop release (Sync-Phase 9).
#   Trigger: push a tag desktop-v<version> (desktop-v1.2.0 = stable, desktop-v1.3.0-beta.1 = beta), or run by hand.
#   Windows runner: desktop tests, self-contained build, signing (secrets BLUEDRIVE_SIGN_PFX_BASE64 + BLUEDRIVE_SIGN_PASSWORD;
#   without them a self-signed development certificate), Velopack installer + update feed, MSIX → GitHub Release;
#   then a macOS runner adds BlueDrive.pkg (Apple silicon) and the osx-<channel> update feed (Sync-Phase 10).
#   The VM picks the release up at the next deploy (scripts/sync-desktop-downloads.sh) and serves it at /downloads/desktop/;
#   installed apps update themselves from there.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (vd 1.2.0 hoặc 1.3.0-beta.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, publish
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version and channel
        id: v
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' -replace '^desktop-v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Phiên bản không hợp lệ: $v" }
          $ch = if ($v -match '-') { 'beta' } else { 'stable' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "channel=$ch" >> $env:GITHUB_OUTPUT
      - name: Desktop tests
        shell: pwsh
        run: |
          dotnet test desktop/tests/BlueDrive.Sync.Tests --nologo -v q
          dotnet test desktop/tests/BlueDrive.Sync.Windows.Tests --nologo -v q
          dotnet test desktop/tests/BlueDrive.Desktop.Tests --nologo -v q
      - name: Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Build release
        shell: pwsh
        env:
          BLUEDRIVE_SIGN_PFX_BASE64: ${{ secrets.BLUEDRIVE_SIGN_PFX_BASE64 }}
          BLUEDRIVE_SIGN_PASSWORD: ${{ secrets.BLUEDRIVE_SIGN_PASSWORD }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          $prev = git describe --tags --abbrev=0 --match 'desktop-v*' HEAD~1 2>$null
          $log = if ($prev) { git log --pretty='- %s' "$prev..HEAD" -- desktop } else { git log --pretty='- %s' -20 -- desktop }
          Set-Content $notes ("BlueDrive Desktop ${{ steps.v.outputs.version }}`n`n" + ($log -join "`n")) -Encoding utf8
          ./desktop/packaging/build.ps1 -Version '${{ steps.v.outputs.version }}' -Channel '${{ steps.v.outputs.channel }}' -Msix -ReleaseNotes $notes
          Copy-Item $notes artifacts/desktop/release-notes.md
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'desktop-v${{ steps.v.outputs.version }}'
          $files = Get-ChildItem artifacts/desktop -File | Where-Object { $_.Name -notmatch '^BlueDrive\.Desktop-.*-Setup\.exe$' -and $_.Name -ne 'releases.json' -and $_.Name -ne 'release-notes.md' }
          $pre = if ('${{ steps.v.outputs.channel }}' -eq 'beta') { '--prerelease' } else { '--latest' }
          gh release create $tag @($files.FullName) --title "BlueDrive Desktop ${{ steps.v.outputs.version }}" --notes-file artifacts/desktop/release-notes.md $pre --target '${{ github.sha }}'

  macos:
    name: macOS (Apple silicon)
    needs: release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Sync tests on macOS
        run: dotnet test desktop/tests/BlueDrive.Sync.Tests --nologo -v q
      - name: Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Build release
        env:
          BLUEDRIVE_MAC_APP_IDENTITY: ${{ secrets.BLUEDRIVE_MAC_APP_IDENTITY }}
          BLUEDRIVE_MAC_INSTALL_IDENTITY: ${{ secrets.BLUEDRIVE_MAC_INSTALL_IDENTITY }}
          BLUEDRIVE_MAC_NOTARY_PROFILE: ${{ secrets.BLUEDRIVE_MAC_NOTARY_PROFILE }}
        run: |
          v='${{ needs.release.outputs.version }}'
          ch='${{ needs.release.outputs.channel }}'
          ./desktop/packaging/macos/build-macos.sh "$v" "$ch" osx-arm64 "$PWD/artifacts/macos"
      - name: Add to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "desktop-v${{ needs.release.outputs.version }}" artifacts/macos/* --clobber
