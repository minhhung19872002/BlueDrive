# BlueDrive CI/CD
#   CI  (push, pull request, weekly): backend build + NuGet vulnerability gate + unit/integration tests (Testcontainers),
#        web/mobile npm audit + lint + build, Trivy scan of the api/worker/web images, docker compose config,
#        BlueDrive Desktop on macOS (sync tests + app build). High/Critical vulnerabilities fail the run (HSMT 3.4).
#   CD  (push to main, CI green): the scanned api/worker/web images are pushed to GHCR, then the VM is told over
#        SSH to pull them. The deploy key is pinned on the VM to ~/apps/bluedrive-deploy.sh (command= in
#        ~/.ssh/authorized_keys), which accepts "<sha> pull" only. Nothing is built on the VM: it is shared with
#        other apps, has 11 GB RAM and no swap, and a .NET build there froze it on 2026-11-11.
#   Secrets: DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (ssh-keyscan of the VM), DEPLOY_TARGET (user@host).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-scan (Monday 07:00 Asia/Ho_Chi_Minh) so newly published CVEs surface without a push.
    - cron: '0 0 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build + unit + integration tests
        shell: pwsh
        run: ./scripts/ci.ps1 -SkipWeb -SkipMobile -SkipDocker

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (High/Critical)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (High/Critical)
        run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npx expo lint

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Sync engine tests on a real macOS disk (inode, NFD → NFC, Trash, Keychain)
        run: dotnet test desktop/tests/BlueDrive.Sync.Tests --nologo -v q
      - name: Build the macOS app (full sync mode)
        run: dotnet publish desktop/src/BlueDrive.Desktop -f net10.0 -r osx-arm64 -c Release --self-contained -o artifacts/macos --nologo -v q

  images:
    name: Docker images (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR on main (below)
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, dockerfile: src/BlueDrive.Api/Dockerfile }
          - { name: worker, dockerfile: src/BlueDrive.Worker/Dockerfile }
          - { name: web, dockerfile: web/Dockerfile }
    env:
      # Trivy 0.67.2 pinned by digest (the official image, not a mutable action tag).
      TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
    steps:
      - uses: actions/checkout@v4
      # GIT_SHA as deploy/docker-compose.yml passes it (shown in "Thông tin hệ thống"); web has no such ARG.
      - name: Build bluedrive/${{ matrix.image.name }}
        run: |
          docker build -f ${{ matrix.image.dockerfile }} -t bluedrive/${{ matrix.image.name }}:ci \
            --build-arg GIT_SHA="$(git rev-parse --short HEAD)" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Trivy scan (HIGH/CRITICAL with a fix available fails the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" "$TRIVY_IMAGE" image             --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1             --ignorefile /repo/.trivyignore --no-progress bluedrive/${{ matrix.image.name }}:ci
      # The image that was just scanned is the one the VM runs (same registry value as scripts/deploy-vm.sh).
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REMOTE: ghcr.io/minhhung19872002/bluedrive-${{ matrix.image.name }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag bluedrive/${{ matrix.image.name }}:ci "$REMOTE"
          docker push -q "$REMOTE"

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy/docker-compose.yml
        env:
          POSTGRES_PASSWORD: ci
          JWT_SECRET: ci_secret_ci_secret_ci_secret_ci_secret
          ADMIN_PASSWORD: Ci@12345
          STORAGE_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ONLYOFFICE_JWT_SECRET: ci_office_ci_office_ci_office_ci_office
        run: docker compose -f deploy/docker-compose.yml config --quiet

  deploy:
    name: Deploy to VM
    needs: [backend, web, mobile, images, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read   # the VM pulls the images with this job's token
    environment:
      name: production
      url: https://bluedrive.bluestar.com.vn
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The GHCR login goes over stdin (never argv), into a throwaway docker config on the VM; the token dies
        # with this job.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_TARGET" "$GITHUB_SHA pull"
      - name: Public health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://bluedrive.bluestar.com.vn/health | grep -q Healthy && exit 0
            sleep 10
          done
          echo "BlueDrive chưa sẵn sàng sau khi deploy" >&2; exit 1
